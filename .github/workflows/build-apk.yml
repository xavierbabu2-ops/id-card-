name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Gradlew Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Secrets & Environment
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Google Services JSON Placeholder
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "tn-painters-id",
              "storage_bucket": "tn-painters-id.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:abcdef0123456789",
                  "android_client_info": {
                    "package_name": "com.aistudio.tnpaintersid.vkqmpz"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} output_apk/TN_Painters_ID_Card_App.apk \;
          ls -lh output_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TN_Painters_ID_Card_APK
          path: output_apk/TN_Painters_ID_Card_App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/TN_Painters_ID_Card_App.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🎨 தமிழ்நாடு பெயிண்டர்கள் மற்றும் ஓவியர்கள் முன்னேற்ற சங்கம் (TNPA²)
            **உறுப்பினர் அடையாள அட்டை செயலி (Member ID Card Generator)**
            
            - 📥 **`TN_Painters_ID_Card_App.apk`** கோப்பை உடனே டவுன்லோட் செய்து மொபைலில் இன்ஸ்டால் செய்து கொள்ளலாம்.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
