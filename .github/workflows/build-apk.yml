name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Debug Keystore (if encoded)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/TN_Painters_ID_Card_App.apk \;

      - name: Upload APK as Workflow Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: TN_Painters_ID_Card_APK
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 📱 தமிழ்நாடு பெயிண்டர்கள் மற்றும் ஓவியர்கள் முன்னேற்ற சங்கம் (TNPA²)
            **உறுப்பினர் அடையாள அட்டை செயலி (Member ID Card Generator App)**
            
            - 📥 கீழே உள்ள **TN_Painters_ID_Card_App.apk** கோப்பை டவுன்லோட் செய்து உங்கள் ஆண்ட்ராய்டு மொபைலில் இன்ஸ்டால் செய்து கொள்ளலாம்.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
