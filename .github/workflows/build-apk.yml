name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Prepare Environment Files
        run: |
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Build Android Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate & Prepare Output APK
        run: |
          mkdir -p output_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp -v {} output_apk/TN_Painters_ID_Card_App.apk \;
          ls -lh output_apk/

      - name: Upload APK Artifact (Direct Download Link)
        uses: actions/upload-artifact@v4
        with:
          name: TN_Painters_ID_Card_APK
          path: output_apk/TN_Painters_ID_Card_App.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (When Tag is Pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/TN_Painters_ID_Card_App.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🎨 தமிழ்நாடு பெயிண்டர்கள் மற்றும் ஓவியர்கள் முன்னேற்ற சங்கம் (TNPA²)
            **உறுப்பினர் அடையாள அட்டை செயலி (Member ID Card Generator)**
            
            - 📥 கீழே உள்ள **`TN_Painters_ID_Card_App.apk`** கோப்பை கிளிக் செய்து நேரடியாக உங்கள் மொபைலில் டவுன்லோட் செய்து கொள்ளலாம்.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
